<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generator</title>
</head>
<body>
  <h1>QR Code Generator</h1>
  <form method="POST">
    <input type="text" name="data" placeholder="Enter text or URL" required>
    <button type="submit">Generate QR</button>
  </form>

  {% if qr_filename %}
  <h2>Your QR Code:</h2>
  <img src="{{ url_for('static', filename='qr_codes/' + qr_filename) }}" alt="QR Code">
  {% endif %}
</body>
</html>
