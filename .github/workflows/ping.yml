name: Ping Website

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the website with verbose retry
        run: |
          curl -L --retry 5 --retry-delay 15 --max-time 20 --connect-timeout 10 -f -k https://qr-generator-y5p9.onrender.com
