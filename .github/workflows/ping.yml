name: Ping Website

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the website (with retries)
        run: |
          curl -L --retry 3 --retry-delay 10 -f https://qr-generator-y5p9.onrender.com > /dev/null 2>&1
